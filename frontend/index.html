<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techpathies AI Career Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Techpathies AI</h1>
        <p>Voice Career Assistant</p>
    </div>

    <div class="voice-card">
        <button id="micButton" class="mic-button" type="button" aria-label="Microphone">
            🎤
        </button>

        <div id="status" class="status">Ready</div>

        <div class="message-box">
            <h3>You</h3>
            <p id="userText">Press the microphone and speak.</p>
        </div>

        <div class="message-box">
            <h3>AI Assistant</h3>
            <p id="aiText">Hello! I am Techpathies AI Career Assistant. Ask me about career choices, skills, roadmaps, or interview preparation.</p>
        </div>

        <div class="buttons">
            <button class="control-button" onclick="stopAudio()">Stop</button>
            <button class="control-button" onclick="restartAudio()">Restart</button>
            <button class="control-button" onclick="continueConversation()">Continue</button>
        </div>
    </div>

    <div class="footer">
        Techpathies Skill Solutions Consultancy
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
